rule_files:
- rules.yaml
evaluation_interval: 1m
tests:
- name: healthy
  interval: 1m
  input_series:
  - series: up{job="docsight",instance="modem"}
    values: 1x16
  - series: docsight_modem_poll_success{job="docsight",instance="modem"}
    values: 1x16
  - series: docsight_last_poll_timestamp_seconds{job="docsight",instance="modem"}
    values: 0+60x16
  - series: docsight_docsis_online{job="docsight",instance="modem"}
    values: 1x16
  - series: docsight_device_uptime_seconds{job="docsight",instance="modem"}
    values: 1000+60x16
  - series: docsight_downstream_snr_valid{job="docsight",instance="modem"}
    values: 1x16
  promql_expr_test:
  - expr: ALERTS{alertstate="firing"}
    eval_time: 10m
    exp_samples: []
- name: no scrape target
  interval: 1m
  input_series: []
  promql_expr_test:
  - expr: ALERTS{alertstate="firing"}
    eval_time: 10m
    exp_samples:
    - labels: ALERTS{alertname="DocsightExporterUnavailable",alertstate="firing",job="docsight",severity="warning"}
      value: 1
- name: unknown status
  interval: 1m
  input_series:
  - series: up{job="docsight",instance="modem"}
    values: 1x16
  - series: docsight_modem_poll_success{job="docsight",instance="modem"}
    values: 1x16
  - series: docsight_last_poll_timestamp_seconds{job="docsight",instance="modem"}
    values: 0+60x16
  - series: docsight_device_uptime_seconds{job="docsight",instance="modem"}
    values: 1000+60x16
  - series: docsight_downstream_snr_valid{job="docsight",instance="modem"}
    values: 1x16
  promql_expr_test:
  - expr: ALERTS{alertstate="firing"}
    eval_time: 10m
    exp_samples: []
- name: exporter unreachable
  interval: 1m
  input_series:
  - series: up{job="docsight",instance="modem"}
    values: '0x16'
  - series: docsight_modem_poll_success{job="docsight",instance="modem"}
    values: '0x16'
  - series: docsight_last_poll_timestamp_seconds{job="docsight",instance="modem"}
    values: 0+60x16
  - series: docsight_docsis_online{job="docsight",instance="modem"}
    values: 1x16
  - series: docsight_device_uptime_seconds{job="docsight",instance="modem"}
    values: 1000+60x16
  - series: docsight_downstream_snr_valid{job="docsight",instance="modem"}
    values: 1x16
  promql_expr_test:
  - expr: ALERTS{alertstate="firing"}
    eval_time: 10m
    exp_samples:
    - labels: ALERTS{alertname="DocsightExporterUnavailable",alertstate="firing",instance="modem",job="docsight",severity="warning"}
      value: 1
- name: failed poll with retained offline reading
  interval: 1m
  input_series:
  - series: up{job="docsight",instance="modem"}
    values: 1x16
  - series: docsight_modem_poll_success{job="docsight",instance="modem"}
    values: '0x16'
  - series: docsight_last_poll_timestamp_seconds{job="docsight",instance="modem"}
    values: 0+60x16
  - series: docsight_docsis_online{job="docsight",instance="modem"}
    values: '0x16'
  - series: docsight_device_uptime_seconds{job="docsight",instance="modem"}
    values: 1000+60x16
  - series: docsight_downstream_snr_valid{job="docsight",instance="modem"}
    values: 1x16
  promql_expr_test:
  - expr: ALERTS{alertstate="firing"}
    eval_time: 10m
    exp_samples:
    - labels: ALERTS{alertname="DocsightModemCollectionFailed",alertstate="firing",instance="modem",job="docsight",severity="warning"}
      value: 1
- name: stale success
  interval: 1m
  input_series:
  - series: up{job="docsight",instance="modem"}
    values: 1x16
  - series: docsight_modem_poll_success{job="docsight",instance="modem"}
    values: 1x16
  - series: docsight_last_poll_timestamp_seconds{job="docsight",instance="modem"}
    values: '0x16'
  - series: docsight_docsis_online{job="docsight",instance="modem"}
    values: 1x16
  - series: docsight_device_uptime_seconds{job="docsight",instance="modem"}
    values: 1000+60x16
  - series: docsight_downstream_snr_valid{job="docsight",instance="modem"}
    values: 1x16
  promql_expr_test:
  - expr: ALERTS{alertstate="firing"}
    eval_time: 10m
    exp_samples:
    - labels: ALERTS{alertname="DocsightModemCollectionFailed",alertstate="firing",instance="modem",job="docsight",severity="warning"}
      value: 1
- name: confirmed offline
  interval: 1m
  input_series:
  - series: up{job="docsight",instance="modem"}
    values: 1x16
  - series: docsight_modem_poll_success{job="docsight",instance="modem"}
    values: 1x16
  - series: docsight_last_poll_timestamp_seconds{job="docsight",instance="modem"}
    values: 0+60x16
  - series: docsight_docsis_online{job="docsight",instance="modem"}
    values: '0x16'
  - series: docsight_device_uptime_seconds{job="docsight",instance="modem"}
    values: 1000+60x16
  - series: docsight_downstream_snr_valid{job="docsight",instance="modem"}
    values: 1x16
  promql_expr_test:
  - expr: ALERTS{alertstate="firing"}
    eval_time: 10m
    exp_samples:
    - labels: ALERTS{alertname="DocsightDocsisOffline",alertstate="firing",instance="modem",job="docsight",severity="warning"}
      value: 1
- name: restart
  interval: 1m
  input_series:
  - series: up{job="docsight",instance="modem"}
    values: 1x16
  - series: docsight_modem_poll_success{job="docsight",instance="modem"}
    values: 1x16
  - series: docsight_last_poll_timestamp_seconds{job="docsight",instance="modem"}
    values: 0+60x16
  - series: docsight_docsis_online{job="docsight",instance="modem"}
    values: 1x16
  - series: docsight_device_uptime_seconds{job="docsight",instance="modem"}
    values: 1000+60x7 5+60x8
  - series: docsight_downstream_snr_valid{job="docsight",instance="modem"}
    values: 1x16
  promql_expr_test:
  - expr: ALERTS{alertstate="firing"}
    eval_time: 10m
    exp_samples:
    - labels: ALERTS{alertname="DocsightModemRestarted",alertstate="firing",instance="modem",job="docsight",severity="info"}
      value: 1
- name: invalid SNR
  interval: 1m
  input_series:
  - series: up{job="docsight",instance="modem"}
    values: 1x16
  - series: docsight_modem_poll_success{job="docsight",instance="modem"}
    values: 1x16
  - series: docsight_last_poll_timestamp_seconds{job="docsight",instance="modem"}
    values: 0+60x16
  - series: docsight_docsis_online{job="docsight",instance="modem"}
    values: 1x16
  - series: docsight_device_uptime_seconds{job="docsight",instance="modem"}
    values: 1000+60x16
  - series: docsight_downstream_snr_valid{job="docsight",instance="modem"}
    values: '0x16'
  promql_expr_test:
  - expr: ALERTS{alertstate="firing"}
    eval_time: 10m
    exp_samples:
    - labels: ALERTS{alertname="DocsightChannelQualityUnavailable",alertstate="firing",instance="modem",job="docsight",severity="warning"}
      value: 1
- name: recovery
  interval: 1m
  input_series:
  - series: up{job="docsight",instance="modem"}
    values: 1x16
  - series: docsight_modem_poll_success{job="docsight",instance="modem"}
    values: 0x7 1x8
  - series: docsight_last_poll_timestamp_seconds{job="docsight",instance="modem"}
    values: 0+60x16
  - series: docsight_docsis_online{job="docsight",instance="modem"}
    values: 1x16
  - series: docsight_device_uptime_seconds{job="docsight",instance="modem"}
    values: 1000+60x16
  - series: docsight_downstream_snr_valid{job="docsight",instance="modem"}
    values: 1x16
  promql_expr_test:
  - expr: ALERTS{alertstate="firing"}
    eval_time: 10m
    exp_samples: []
